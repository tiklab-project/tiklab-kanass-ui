<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- 加粗文档主体（stroke-width="4"） -->
    <rect x="20" y="15" width="60" height="70" fill="none" stroke="#000000" stroke-width="4" rx="2"/>

    <!-- 加粗文档顶部横线 -->
    <line x1="20" y1="25" x2="80" y2="25" stroke="#000000" stroke-width="4"/>

    <!-- 加粗放大镜 -->
    <circle cx="65" cy="45" r="12" fill="none" stroke="#000000" stroke-width="4"/>
    <line x1="73" y1="53" x2="85" y2="65" stroke="#000000" stroke-width="4"/>

    <!-- 加粗文档内容横线 -->
    <line x1="25" y1="35" x2="45" y2="35" stroke="#000000" stroke-width="3"/>
    <line x1="25" y1="45" x2="55" y2="45" stroke="#000000" stroke-width="3"/>
    <line x1="25" y1="55" x2="50" y2="55" stroke="#000000" stroke-width="3"/>
    <line x1="25" y1="65" x2="75" y2="65" stroke="#000000" stroke-width="3"/>
    <line x1="25" y1="75" x2="60" y2="75" stroke="#000000" stroke-width="3"/>
</svg>